<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="BIAS">
  <defs>
    <filter id="bias-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- coin, cut along the diagonal; halves pushed apart -->
  <g fill="#121418" stroke="#E8EAED" stroke-width="5" stroke-linejoin="round">
    <path d="M 71.2 23.2 A 33 33 0 0 0 23.2 71.2 Z" transform="translate(-3.5 -3.5)"/>
    <path d="M 71.2 23.2 A 33 33 0 0 1 23.2 71.2 Z" transform="translate(3.5 3.5)"/>
  </g>
  <!-- neon arrow ↗ through the cut -->
  <g filter="url(#bias-glow)" stroke="#00E58F" fill="#00E58F" stroke-linecap="round" stroke-linejoin="round">
    <line x1="13" y1="87" x2="76" y2="24" stroke-width="7.5"/>
    <path d="M 89 11 L 85.5 41 L 59 14.5 Z" stroke-width="2.5"/>
  </g>
</svg>
