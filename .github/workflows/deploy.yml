# Deploys the site (Cloudflare Worker, free plan). Needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets.
name: deploy
on:
  push:
    branches: [dapp]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: configured?
        id: cfg
        run: if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::no CLOUDFLARE_API_TOKEN — skipping deploy"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != '1'
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != '1'
        with: { node-version: 22, cache: pnpm }
      - if: steps.cfg.outputs.skip != '1'
        run: pnpm install --frozen-lockfile
      - if: steps.cfg.outputs.skip != '1'
        run: pnpm --filter @bias/web deploy
      - if: steps.cfg.outputs.skip != '1'
        run: node scripts/check-no-secrets.mjs
