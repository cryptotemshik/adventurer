# Cloudflare Worker: API (/api/*) + static frontend (Workers Static Assets) on one origin.
name = "brazil-tracker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../../dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
TSE_BASE_URL = "https://resultados.tse.jus.br/oficial"
TSE_CYCLE = "ele2026"
TSE_ELECTION = "6258"          # 2º turno, Presidente (from comum/config/ele-c.json)
PRICE_SOURCE = "hyperliquid"   # hyperliquid | yahoo
PRICE_SYMBOL = "xyz:EWZ"       # HIP-3 DEX "xyz"; for PRICE_SOURCE=yahoo use "EWZ"
ALERT_THRESHOLDS_PP = "0.5,0.2,0.1"
BUILD_VERSION = "dev"          # overridden at deploy: wrangler deploy --var BUILD_VERSION:<sha>
REPLAY = "0"

# Global singleton that fetches upstream data, keeps history (SQLite) and alert state.
[[durable_objects.bindings]]
name = "TRACKER"
class_name = "Tracker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tracker"]

# Per-IP rate limit (Workers Rate Limiting binding).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "62581"
simple = { limit = 600, period = 60 }  # generous: mobile carriers put many users behind one IP (CGNAT)

# Alerts + history sampling once a minute.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# Secrets (never in this file): wrangler secret put TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
